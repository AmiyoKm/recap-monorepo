name: prod-deploy

on:
  push:
    branches: [prod]

concurrency:
  group: prod-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    env:
      DEPLOY_ENV: prod
      WEB_HOST: recap.${{ vars.APP_DOMAIN }}
      API_HOST: recap-api-prod.${{ vars.APP_DOMAIN }}
      WORKER: recap-web
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      - name: Load env file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          env_file="$RUNNER_TEMP/deploy.env"
          printf '%s\n' "$ENV_FILE" > "$env_file"
          keys=$(grep -oE '^[A-Za-z_][A-Za-z0-9_]*=' "$env_file" | tr -d '=' | sort -u | jq -R . | jq -sc .)
          bun --env-file="$env_file" -e 'console.log(JSON.stringify(process.env))' \
            | jq --argjson keys "$keys" '. as $env | $keys | map({key: ., value: $env[.]}) | from_entries' > "$RUNNER_TEMP/deploy-env.json"
          jq -r '.[] | select(. != "") | "::add-mask::" + .' "$RUNNER_TEMP/deploy-env.json"
          jq 'del(.CLOUDFLARE_API_TOKEN)' "$RUNNER_TEMP/deploy-env.json" > "$RUNNER_TEMP/api-secrets.json"

      - name: Check required env
        working-directory: apps/api
        run: bun --env-file="$RUNNER_TEMP/deploy.env" run env:check

      - name: Migrate database
        working-directory: apps/api
        run: CLOUDFLARE_API_TOKEN=$(jq -r .CLOUDFLARE_API_TOKEN "$RUNNER_TEMP/deploy-env.json") bunx wrangler d1 migrations apply DB --remote --env "$DEPLOY_ENV"

      - name: Deploy API
        working-directory: apps/api
        run: CLOUDFLARE_API_TOKEN=$(jq -r .CLOUDFLARE_API_TOKEN "$RUNNER_TEMP/deploy-env.json") bunx wrangler deploy --env "$DEPLOY_ENV" --domain "$API_HOST" --secrets-file "$RUNNER_TEMP/api-secrets.json"

      - name: Check API health
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 "https://$API_HOST/health"

      - run: bun --filter @recap/web build
        env:
          VITE_API_URL: https://${{ env.API_HOST }}
      - name: Deploy web
        working-directory: apps/web
        run: CLOUDFLARE_API_TOKEN=$(jq -r .CLOUDFLARE_API_TOKEN "$RUNNER_TEMP/deploy-env.json") bunx wrangler deploy --name "${{ env.WORKER }}" --domain "${{ env.WEB_HOST }}"
