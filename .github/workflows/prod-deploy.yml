name: prod-deploy

on:
  push:
    branches: [prod]

concurrency:
  group: prod-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_ENV: prod
      WEB_HOST: recap.${{ vars.APP_DOMAIN }}
      API_HOST: recap-api-prod.${{ vars.APP_DOMAIN }}
      WORKER: recap-web
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Set image name
        id: image
        run: echo "ref=$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/recap/api-${{ env.DEPLOY_ENV }}:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - run: gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        id: secrets
        with:
          secrets: |-
            database_url:${{ vars.GCP_PROJECT_ID }}/recap-${{ env.DEPLOY_ENV }}-database-url
      - run: bun run db:migrate
        env:
          DATABASE_URL: ${{ steps.secrets.outputs.database_url }}

      - name: Deploy API
        run: |
          gcloud run deploy "recap-api-${{ env.DEPLOY_ENV }}" \
            --image "${{ steps.image.outputs.ref }}" \
            --region "$GCP_REGION" \
            --service-account "${{ vars.GCP_RUNTIME_SA }}" \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 1 \
            --cpu 1 \
            --memory 512Mi \
            --cpu-throttling \
            --no-cpu-boost \
            --set-env-vars "WEB_ORIGIN=https://${{ env.WEB_HOST }},BETTER_AUTH_URL=https://${{ env.API_HOST }},REDIS_KEY_PREFIX=${{ env.DEPLOY_ENV }}:" \
            --set-secrets "DATABASE_URL=recap-${{ env.DEPLOY_ENV }}-database-url:latest,BETTER_AUTH_SECRET=recap-${{ env.DEPLOY_ENV }}-auth-secret:latest,REDIS_URL=recap-redis-url:latest" \
            --quiet

      - name: Check API health
        run: |
          url=$(gcloud run services describe "recap-api-${{ env.DEPLOY_ENV }}" --region "$GCP_REGION" --format 'value(status.url)')
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 "$url/health"

      - run: bun --filter @recap/web build
        env:
          VITE_API_URL: https://${{ env.API_HOST }}
      - name: Deploy web
        working-directory: apps/web
        run: bunx wrangler deploy --name "${{ env.WORKER }}" --domain "${{ env.WEB_HOST }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
