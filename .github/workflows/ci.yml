name: ci

on:
  pull_request:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint
      - name: Lint file names
        run: bun run lint:files
      - name: Lint comments
        run: bun run lint:comments
      - name: Fallow
        run: bun run lint:fallow
      - name: Typecheck
        run: bun run typecheck

      - name: Build web
        run: bun --filter @recap/web build
        env:
          VITE_API_URL: http://localhost:3000
      - name: Build API
        run: bun --filter @recap/api build

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: recap
          POSTGRES_PASSWORD: recap
          POSTGRES_DB: recap_identity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recap -d recap_identity_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      - name: Migrate test database
        run: bun run db:migrate
        env:
          DATABASE_URL: postgres://recap:recap@localhost:5432/recap_identity_test
      - name: Test API
        working-directory: apps/api
        run: bun test
      - name: Test web
        working-directory: apps/web
        run: bun test
