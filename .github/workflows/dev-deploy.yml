name: dev-deploy

on:
  push:
    branches: [development]

concurrency:
  group: dev-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    env:
      DEPLOY_ENV: dev
      WEB_HOST: dev.recap.${{ vars.APP_DOMAIN }}
      API_HOST: recap-api-dev.${{ vars.APP_DOMAIN }}
      WORKER: recap-web-dev
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Set image name
        id: image
        run: echo "ref=$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/recap/api-${{ env.DEPLOY_ENV }}:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - run: gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load env file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          env_file="$RUNNER_TEMP/deploy.env"
          printf '%s\n' "$ENV_FILE" > "$env_file"
          keys=$(grep -oE '^[A-Za-z_][A-Za-z0-9_]*=' "$env_file" | tr -d '=' | sort -u | jq -R . | jq -sc .)
          bun --env-file="$env_file" -e 'console.log(JSON.stringify(process.env))' \
            | jq --argjson keys "$keys" '. as $env | $keys | map({key: ., value: $env[.]}) | from_entries' > "$RUNNER_TEMP/deploy-env.json"
          jq -r '.[] | select(. != "") | "::add-mask::" + .' "$RUNNER_TEMP/deploy-env.json"
          jq 'del(.PORT, .CLOUDFLARE_API_TOKEN)' "$RUNNER_TEMP/deploy-env.json" > "$RUNNER_TEMP/api-env.yaml"
      - name: Migrate database
        run: DATABASE_URL=$(jq -r .DATABASE_URL "$RUNNER_TEMP/deploy-env.json") bun run db:migrate

      - name: Deploy API
        run: |
          gcloud run deploy "recap-api-${{ env.DEPLOY_ENV }}" \
            --image "${{ steps.image.outputs.ref }}" \
            --region "$GCP_REGION" \
            --service-account "${{ vars.GCP_RUNTIME_SA }}" \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 1 \
            --cpu 1 \
            --memory 512Mi \
            --cpu-throttling \
            --no-cpu-boost \
            --env-vars-file "$RUNNER_TEMP/api-env.yaml" \
            --clear-secrets \
            --quiet

      - name: Check API health
        run: |
          url=$(gcloud run services describe "recap-api-${{ env.DEPLOY_ENV }}" --region "$GCP_REGION" --format 'value(status.url)')
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 "$url/health"

      - run: bun --filter @recap/web build
        env:
          VITE_API_URL: https://${{ env.API_HOST }}
      - name: Deploy web
        working-directory: apps/web
        run: CLOUDFLARE_API_TOKEN=$(jq -r .CLOUDFLARE_API_TOKEN "$RUNNER_TEMP/deploy-env.json") bunx wrangler deploy --name "${{ env.WORKER }}" --domain "${{ env.WEB_HOST }}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
